<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="933px" preserveAspectRatio="none" style="width:1095px;height:933px;background:#FFFFFF;" version="1.1" viewBox="0 0 1095 933" width="1095px" zoomAndPan="magnify"><title>Appointment lifecycle (enforced in domain/Lifecycle.scala)</title><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="406.1846" x="337.848" y="23.5625">Appointment lifecycle (enforced in domain/Lifecycle.scala)</text><ellipse cx="442.63" cy="53.9395" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#E6EEF7" height="40" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="50" x="162.63" y="188.9395"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="34.2075" x="170.5262" y="213.6685">HELD</text><rect fill="#E6EEF7" height="40" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="87.7017" x="553.63" y="355.4395"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="77.7017" x="558.63" y="380.1685">CONFIRMED</text><rect fill="#E6EEF7" height="40" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="87.4668" x="301.13" y="505.9395"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="77.4668" x="306.13" y="530.6685">CANCELLED</text><rect fill="#E6EEF7" height="40" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="64.0376" x="103.63" y="431.4395"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="54.0376" x="108.63" y="456.1685">EXPIRED</text><rect fill="#E6EEF7" height="40" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="98.3848" x="676.63" y="505.9395"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="88.3848" x="681.63" y="530.6685">IN_PROGRESS</text><rect fill="#E6EEF7" height="40" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="145.3828" x="620.13" y="663.4395"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="135.3828" x="625.13" y="688.1685">AWAITING_PAYMENT</text><rect fill="#E6EEF7" height="40" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="90.2344" x="594.63" y="804.9395"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="80.2344" x="599.63" y="829.6685">COMPLETED</text><rect fill="#E6EEF7" height="40" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="76.4155" x="524.63" y="580.4395"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="66.4155" x="529.63" y="605.1685">NO_SHOW</text><ellipse cx="412.63" cy="916.9395" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="412.63" cy="916.9395" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_GMN27"><path d="M247.13,162.9395 L247.13,204.9395 L212.91,208.9395 L247.13,212.9395 L247.13,255.3164 A6,6 0 0 0 253.13,261.3164 L620.5187,261.3164 A6,6 0 0 0 626.5187,255.3164 L626.5187,166.9395 L616.5187,156.9395 L253.13,156.9395 A6,6 0 0 0 247.13,162.9395 " fill="#FFFFFF" style="stroke:#B5BFBB;stroke-width:0.5;"/><path d="M616.5187,156.9395 L616.5187,163.9395 A3,3 0 0 0 619.5187,166.9395 L626.5187,166.9395 L616.5187,156.9395 " fill="#FFFFFF" style="stroke:#B5BFBB;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="259.0923" x="253.13" y="174.5332">A hold lasts 10 minutes (HOLD_MINUTES).</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="321.0137" x="253.13" y="190.2627">HELD, CONFIRMED and IN_PROGRESS take the bay,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.6582" x="253.13" y="205.9922">the technician and the vehicle: the database's</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="292.2905" x="253.13" y="221.7217">EXCLUDE constraints apply to these three (V2).</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="289.7197" x="253.13" y="237.4512">Cancelling or expiring a consulted appointment</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="358.3887" x="253.13" y="253.1807">reopens its consultation request (BOOKED &#8594; APPROVED).</text></g><g id="elem_GMN30"><path d="M800.13,660.9395 L800.13,679.4395 L765.47,683.4395 L800.13,687.4395 L800.13,706.1279 A6,6 0 0 0 806.13,712.1279 L1082.8805,712.1279 A6,6 0 0 0 1088.8805,706.1279 L1088.8805,664.9395 L1078.8805,654.9395 L806.13,654.9395 A6,6 0 0 0 800.13,660.9395 " fill="#FFFFFF" style="stroke:#B5BFBB;stroke-width:0.5;"/><path d="M1078.8805,654.9395 L1078.8805,661.9395 A3,3 0 0 0 1081.8805,664.9395 L1088.8805,664.9395 L1078.8805,654.9395 " fill="#FFFFFF" style="stroke:#B5BFBB;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="256.585" x="806.13" y="672.5332">The work is done: the bay, technician and</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="267.7505" x="806.13" y="688.2627">vehicle are free again (V3). The admin sees</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.0674" x="806.13" y="703.9922">every job by status in "Jobs &amp; payments".</text></g><!--link *start* to HELD--><g id="link_*start*_HELD"><path d="M433.33,57.7695 C402.09,67.5895 299.03,102.5995 229.63,156.9395 C218.25,165.8495 211.4262,173.4923 203.8462,183.8823 " fill="none" id="*start*-to-HELD" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="200.31,188.7295,208.8458,183.8162,203.2569,184.6901,202.3829,179.1012,200.31,188.7295" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="135.0527" x="368.0477" y="107.5332">customer picks a time</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="197.8882" x="336.63" y="123.2627">(POST /api/appointments/holds)</text></g><!--link *start* to CONFIRMED--><g id="link_*start*_CONFIRMED"><path d="M452.81,56.2195 C487.72,61.2295 602.62,83.0295 643.63,156.9395 C679.65,221.8695 666.21,254.9995 638.63,323.9395 C634.01,335.4695 629.8075,341.963 621.9375,350.693 " fill="none" id="*start*-to-CONFIRMED" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="617.92,355.1495,626.9172,351.1431,621.2679,351.4357,620.9752,345.7865,617.92,355.1495" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="148.459" x="671.2762" y="206.0332">customer books directly</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="159.7515" x="665.63" y="221.7627">(POST /api/appointments)</text></g><!--link HELD to CONFIRMED--><g id="link_HELD_CONFIRMED"><path d="M199.48,229.3095 C206.93,240.0195 217.43,252.7695 229.63,260.9395 C243.46,270.2095 452.9318,332.1234 547.6718,359.8634 " fill="none" id="HELD-to-CONFIRMED" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="553.43,361.5495,545.9167,355.1816,548.6315,360.1444,543.6686,362.8592,553.43,361.5495" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="159.8213" x="445.6969" y="304.5332">customer confirms before</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.9551" x="420.63" y="320.2627">hold_expires_at (POST &#8230;/confirm)</text></g><!--link HELD to CANCELLED--><g id="link_HELD_CANCELLED"><path d="M202.05,229.0195 C209.83,238.8995 219.83,250.9495 229.63,260.9395 C243.97,275.5695 253.35,273.8395 264.63,290.9395 C312.06,362.8795 292.04,395.3795 322.63,475.9395 C326.4,485.8795 328.6464,491.236 332.7864,500.166 " fill="none" id="HELD-to-CANCELLED" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="335.31,505.6095,335.1535,495.7618,333.207,501.0732,327.8956,499.1267,335.31,505.6095" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="166.7656" x="304.63" y="380.5332">customer releases the hold</text></g><!--link HELD to EXPIRED--><g id="link_HELD_EXPIRED"><path d="M162.58,215.0395 C127.25,223.7295 64.04,245.1195 36.63,290.9395 C6,342.1195 64.9881,397.9792 103.8381,427.7592 " fill="none" id="HELD-to-EXPIRED" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="108.6,431.4095,103.8906,422.7595,104.6317,428.3676,99.0236,429.1088,108.6,431.4095" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="216.8423" x="40.6071" y="304.5332">hold ran out (system: booking flow,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.7964" x="37.63" y="320.2627">job move, confirm, or HoldSweeper)</text></g><!--link CONFIRMED to IN_PROGRESS--><g id="link_CONFIRMED_IN_PROGRESS"><path d="M641.86,384.4695 C666.9,391.3895 696.55,404.0495 713.63,426.9395 C730.64,449.7495 731.2287,478.2084 729.1187,499.6084 " fill="none" id="CONFIRMED-to-IN_PROGRESS" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="728.53,505.5795,733.3938,497.0154,729.0206,500.6036,725.4324,496.2304,728.53,505.5795" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="129.6636" x="786.2225" y="440.5332">advisor, admin or the</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="160.4307" x="770.839" y="456.2627">assigned technician starts</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="242.8486" x="729.63" y="471.9922">(any time, also before the booked start)</text></g><!--link IN_PROGRESS to AWAITING_PAYMENT--><g id="link_IN_PROGRESS_AWAITING_PAYMENT"><path d="M721.58,546.0095 C715.25,575.8495 704.3067,627.4104 697.9467,657.3504 " fill="none" id="IN_PROGRESS-to-AWAITING_PAYMENT" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="696.7,663.2195,702.4828,655.247,697.7389,658.3286,694.6574,653.5847,696.7,663.2195" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="129.6636" x="772.4003" y="589.5332">advisor, admin or the</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="173.7861" x="750.339" y="605.2627">assigned technician finishes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="243.2041" x="715.63" y="620.9922">(the customer has checked the vehicle)</text></g><!--link AWAITING_PAYMENT to COMPLETED--><g id="link_AWAITING_PAYMENT_COMPLETED"><path d="M685.37,703.5395 C675.27,730.1095 659.2298,772.3302 649.0998,799.0102 " fill="none" id="AWAITING_PAYMENT-to-COMPLETED" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="646.97,804.6195,653.9042,797.6254,648.7448,799.945,646.4251,794.7857,646.97,804.6195" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="105.2505" x="680.859" y="755.5332">dealership admin</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="127.7085" x="669.63" y="771.2627">records the payment</text></g><!--link CONFIRMED to CANCELLED--><g id="link_CONFIRMED_CANCELLED"><path d="M553.61,383.6395 C482.2,395.5195 348.36,418.7495 341.63,426.9395 C323.57,448.8995 328.5335,478.191 335.4235,499.881 " fill="none" id="CONFIRMED-to-CANCELLED" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="337.24,505.5995,338.3275,495.8108,335.7262,500.8341,330.703,498.2328,337.24,505.5995" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="190.4995" x="352.9862" y="448.5332">customer before the start time;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="211.2119" x="342.63" y="464.2627">advisor / admin before work starts</text></g><!--link CONFIRMED to NO_SHOW--><g id="link_CONFIRMED_NO_SHOW"><path d="M594.64,395.4495 C588.05,437.4795 573.2211,531.9621 566.5811,574.2321 " fill="none" id="CONFIRMED-to-NO_SHOW" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="565.65,580.1595,570.9982,571.8892,566.4259,575.22,563.0951,570.6478,565.65,580.1595" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="98.4839" x="597.0155" y="448.5332">advisor / admin,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="113.2549" x="589.63" y="464.2627">after the start time</text></g><!--link CONFIRMED to CONFIRMED--><g id="link_CONFIRMED_CONFIRMED"><path d="M641.89,362.8195 C660.65,361.8695 676.63,366.0795 676.63,375.4395 C676.63,384.7995 666.6423,389.3129 647.8823,388.3629 " fill="none" id="CONFIRMED-to-CONFIRMED" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="641.89,388.0595,650.6762,392.5095,646.8836,388.3123,651.0808,384.5197,641.89,388.0595" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="172.5103" x="692.9259" y="372.5332">workshop controller / admin</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="193.1021" x="682.63" y="388.2627">moves the job (bay, technician)</text></g><!--link COMPLETED to *end*--><g id="link_COMPLETED_*end*"><path d="M611.11,844.9495 C594.8,855.1895 573.66,867.4395 553.63,875.9395 C507.02,895.7295 453.5499,907.7249 429.4299,912.6249 " fill="none" id="COMPLETED-to-*end*" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="423.55,913.8195,433.1662,915.9476,428.4499,912.824,431.5735,908.1078,423.55,913.8195" style="stroke:#4A5961;stroke-width:1.0;"/></g><!--link CANCELLED to *end*--><g id="link_CANCELLED_*end*"><path d="M347.95,545.9695 C360.08,615.3695 400.6972,847.689 409.8172,899.879 " fill="none" id="CANCELLED-to-*end*" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="410.85,905.7895,413.2411,896.2352,409.9893,900.8641,405.3605,897.6123,410.85,905.7895" style="stroke:#4A5961;stroke-width:1.0;"/></g><!--link NO_SHOW to *end*--><g id="link_NO_SHOW_*end*"><path d="M553.47,620.6395 C524.84,680.6495 440.3234,857.8741 419.6434,901.2241 " fill="none" id="NO_SHOW-to-*end*" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="417.06,906.6395,424.5453,900.2387,419.2128,902.1267,417.3248,896.7942,417.06,906.6395" style="stroke:#4A5961;stroke-width:1.0;"/></g><!--link EXPIRED to *end*--><g id="link_EXPIRED_*end*"><path d="M161.07,471.4995 C191.86,496.9595 239.63,545.1995 239.63,599.4395 C239.63,599.4395 239.63,599.4395 239.63,825.9395 C239.63,899.2395 357.3726,912.5405 395.5526,915.0205 " fill="none" id="EXPIRED-to-*end*" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="401.54,915.4095,392.8182,910.8345,396.5505,915.0854,392.2997,918.8177,401.54,915.4095" style="stroke:#4A5961;stroke-width:1.0;"/></g><!--SRC=[bLJBSjD04BphAuOS8AQScCSjL55bOX4R_2hRUL2OSgsbSRHajIjsrWwwSU83-0W-B5_2h2p5YY473gwIfPcUxfxUVI9rfDOnme9Shl1OhbCLEEaKGZlBZDGkHUr0oHL6USHl3r6lZ8qm1gaXDgcGkjMllXvJ99He18baH4mpbqEC