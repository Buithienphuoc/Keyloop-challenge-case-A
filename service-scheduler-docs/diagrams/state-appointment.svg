Arial" font-size="13" lengthAdjust="spacing" textLength="289.7197" x="252.26" y="237.4512">Cancelling or expiring a consulted appointment</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="358.3887" x="252.26" y="253.1807">reopens its consultation request (BOOKED &#8594; APPROVED).</text></g><!--link *start* to HELD--><g id="link_*start*_HELD"><path d="M432.46,57.7695 C401.22,67.5895 298.16,102.5995 228.76,156.9395 C217.38,165.8495 210.5562,173.4923 202.9762,183.8823 " fill="none" id="*start*-to-HELD" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="199.44,188.7295,207.9758,183.8162,202.3869,184.6901,201.5129,179.1012,199.44,188.7295" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="135.0527" x="367.1777" y="107.5332">customer picks a time</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="197.8882" x="335.76" y="123.2627">(POST /api/appointments/holds)</text></g><!--link *start* to CONFIRMED--><g id="link_*start*_CONFIRMED"><path d="M451.94,56.2195 C486.85,61.2295 601.75,83.0295 642.76,156.9395 C678.78,221.8695 665.34,254.9995 637.76,323.9395 C633.14,335.4695 628.9375,341.963 621.0675,350.693 " fill="none" id="*start*-to-CONFIRMED" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="617.05,355.1495,626.0472,351.1431,620.3979,351.4357,620.1052,345.7865,617.05,355.1495" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="148.459" x="670.4062" y="206.0332">customer books directly</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="159.7515" x="664.76" y="221.7627">(POST /api/appointments)</text></g><!--link HELD to CONFIRMED--><g id="link_HELD_CONFIRMED"><path d="M198.61,229.3095 C206.06,240.0195 216.56,252.7695 228.76,260.93