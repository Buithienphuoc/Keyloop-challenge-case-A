<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="976px" preserveAspectRatio="none" style="width:1178px;height:976px;background:#FFFFFF;" version="1.1" viewBox="0 0 1178 976" width="1178px" zoomAndPan="magnify"><title>Appointment lifecycle (enforced in domain/Lifecycle.scala)</title><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="406.1846" x="379.2409" y="23.5625">Appointment lifecycle (enforced in domain/Lifecycle.scala)</text><rect fill="#EEF0F0" height="40" rx="6" ry="6" style="stroke:#A7B0B4;stroke-width:0.5;" width="76.4155" x="66.87" y="549.4395"/><text fill="#7D878C" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="66.4155" x="71.87" y="574.1685">NO_SHOW</text><ellipse cx="491.87" cy="53.9395" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#E6EEF7" height="40" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="50" x="719.87" y="173.4395"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="34.2075" x="727.7662" y="198.1685">HELD</text><rect fill="#E6EEF7" height="40" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="87.7017" x="400.87" y="324.4395"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="77.7017" x="405.87" y="349.1685">CONFIRMED</text><rect fill="#E6EEF7" height="40" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="87.4668" x="367.37" y="474.9395"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="77.4668" x="372.37" y="499.6685">CANCELLED</text><rect fill="#E6EEF7" height="40" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="64.0376" x="983.87" y="400.4395"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="54.0376" x="988.87" y="425.1685">EXPIRED</text><rect fill="#E6EEF7" height="40" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="98.3848" x="489.87" y="474.9395"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="88.3848" x="494.87" y="499.6685">IN_PROGRESS</text><rect fill="#E6EEF7" height="40" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="145.3828" x="465.37" y="632.4395"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="135.3828" x="470.37" y="657.1685">AWAITING_PAYMENT</text><rect fill="#E6EEF7" height="40" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="90.2344" x="471.87" y="789.9395"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="80.2344" x="476.87" y="814.6685">COMPLETED</text><ellipse cx="473.87" cy="901.9395" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="473.87" cy="901.9395" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_GMN27"><path d="M804.87,162.9395 L804.87,189.4395 L770.13,193.4395 L804.87,197.4395 L804.87,223.8574 A6,6 0 0 0 810.87,229.8574 L1140.8837,229.8574 A6,6 0 0 0 1146.8837,223.8574 L1146.8837,166.9395 L1136.8837,156.9395 L810.87,156.9395 A6,6 0 0 0 804.87,162.9395 " fill="#FFFFFF" style="stroke:#B5BFBB;stroke-width:0.5;"/><path d="M1136.8837,156.9395 L1136.8837,163.9395 A3,3 0 0 0 1139.8837,166.9395 L1146.8837,166.9395 L1136.8837,156.9395 " fill="#FFFFFF" style="stroke:#B5BFBB;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="259.0923" x="810.87" y="174.5332">A hold lasts 10 minutes (HOLD_MINUTES).</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="321.0137" x="810.87" y="190.2627">HELD, CONFIRMED and IN_PROGRESS take the bay,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.6582" x="810.87" y="205.9922">the technician and the vehicle: the database's</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="292.2905" x="810.87" y="221.7217">EXCLUDE constraints apply to these three (V2).</text></g><g id="elem_GMN30"><path d="M645.37,629.9395 L645.37,648.4395 L610.62,652.4395 L645.37,656.4395 L645.37,675.1279 A6,6 0 0 0 651.37,681.1279 L923.9056,681.1279 A6,6 0 0 0 929.9056,675.1279 L929.9056,633.9395 L919.9056,623.9395 L651.37,623.9395 A6,6 0 0 0 645.37,629.9395 " fill="#FFFFFF" style="stroke:#B5BFBB;stroke-width:0.5;"/><path d="M919.9056,623.9395 L919.9056,630.9395 A3,3 0 0 0 922.9056,633.9395 L929.9056,633.9395 L919.9056,623.9395 " fill="#FFFFFF" style="stroke:#B5BFBB;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="256.585" x="651.37" y="641.5332">The work is done: the bay, technician and</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="261.0664" x="651.37" y="657.2627">vehicle are free again (V3). The technician</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="263.5356" x="651.37" y="672.9922">closes the job once the customer has paid.</text></g><!--link *start* to HELD--><g id="link_*start*_HELD"><path d="M500.28,59.5095 C534.58,78.1495 659.2984,145.9341 714.5284,175.9541 " fill="none" id="*start*-to-HELD" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="719.8,178.8195,713.8028,171.007,715.407,176.4317,709.9824,178.0358,719.8,178.8195" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="135.0527" x="650.2877" y="107.5332">customer picks a time</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="197.8882" x="618.87" y="123.2627">(POST /api/appointments/holds)</text></g><!--link *start* to CONFIRMED--><g id="link_*start*_CONFIRMED"><path d="M490.41,63.8895 C483.87,104.0295 458.1344,261.9875 448.9544,318.3575 " fill="none" id="*start*-to-CONFIRMED" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="447.99,324.2795,453.3846,316.0394,448.7937,319.3445,445.4886,314.7535,447.99,324.2795" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="148.459" x="481.5162" y="190.5332">customer books directly</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="159.7515" x="475.87" y="206.2627">(POST /api/appointments)</text></g><!--link HELD to CONFIRMED--><g id="link_HELD_CONFIRMED"><path d="M719.59,201.7695 C684.68,212.3595 620.2,233.5795 568.87,259.9395 C532.39,278.6695 498.4955,302.4834 474.2255,320.7334 " fill="none" id="HELD-to-CONFIRMED" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="469.43,324.3395,479.0272,322.1274,473.4262,321.3344,474.2192,315.7335,469.43,324.3395" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="159.8213" x="594.9369" y="273.5332">customer confirms before</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.9551" x="569.87" y="289.2627">hold_expires_at (POST &#8230;/confirm)</text></g><!--link HELD to CANCELLED--><g id="link_HELD_CANCELLED"><path d="M759.99,213.5195 C768.85,225.9495 779.2,242.9695 783.87,259.9395 C790.99,285.8295 804.71,415.6095 776.87,444.9395 C729.98,494.3295 538.61,461.4095 471.87,474.9395 C466.21,476.0895 466.1192,475.9369 460.3492,477.5469 " fill="none" id="HELD-to-CANCELLED" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="454.57,479.1595,464.3139,480.5934,459.386,477.8156,462.1638,472.8878,454.57,479.1595" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="166.7656" x="793.87" y="349.5332">customer releases the hold</text></g><!--link HELD to EXPIRED--><g id="link_HELD_EXPIRED"><path d="M765.96,213.5795 C772.7,219.2095 780.36,225.1395 787.87,229.9395 C868.44,281.4195 918.01,251.7695 981.87,322.9395 C1001.56,344.8895 1009.034,373.0294 1012.534,394.2594 " fill="none" id="HELD-to-EXPIRED" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="1013.51,400.1795,1015.9927,390.6487,1012.6967,395.246,1008.0993,391.95,1013.51,400.1795" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="216.8423" x="950.8471" y="273.5332">hold ran out (system: booking flow,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.7964" x="947.87" y="289.2627">job move, confirm, or HoldSweeper)</text></g><!--link CONFIRMED to IN_PROGRESS--><g id="link_CONFIRMED_IN_PROGRESS"><path d="M470.23,364.5195 C480.48,373.2195 491.77,384.1995 499.87,395.9395 C516.91,420.6695 526.4871,448.1559 532.3471,468.8759 " fill="none" id="CONFIRMED-to-IN_PROGRESS" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="533.98,474.6495,535.3797,464.9006,532.6193,469.8382,527.6817,467.0777,533.98,474.6495" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="183.606" x="555.4913" y="409.5332">the assigned technician starts</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="242.8486" x="525.87" y="425.2627">(any time, also before the booked start)</text><text fill="#7D878C" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="210.8818" x="541.8534" y="440.9922">advisor / admin: not in this version</text></g><!--link IN_PROGRESS to AWAITING_PAYMENT--><g id="link_IN_PROGRESS_AWAITING_PAYMENT"><path d="M538.74,515.0095 C538.55,544.8495 538.2181,596.2796 538.0281,626.2196 " fill="none" id="IN_PROGRESS-to-AWAITING_PAYMENT" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="537.99,632.2195,542.047,623.245,538.0217,627.2196,534.0472,623.1943,537.99,632.2195" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="196.9614" x="562.9913" y="558.5332">the assigned technician finishes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="243.2041" x="539.87" y="574.2627">(the customer has checked the vehicle)</text><text fill="#7D878C" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="210.8818" x="556.0311" y="589.9922">advisor / admin: not in this version</text></g><!--link AWAITING_PAYMENT to COMPLETED--><g id="link_AWAITING_PAYMENT_COMPLETED"><path d="M535.29,672.5095 C531.26,702.3495 524.3023,753.8333 520.2623,783.7733 " fill="none" id="AWAITING_PAYMENT-to-COMPLETED" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="519.46,789.7195,524.6276,781.3352,520.1286,784.7644,516.6994,780.2654,519.46,789.7195" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="145.5264" x="534.9166" y="724.5332">the assigned technician</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="127.7085" x="543.8256" y="740.2627">records the payment</text><text fill="#7D878C" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="153.6196" x="530.87" y="755.9922">admin: not in this version</text></g><!--link CONFIRMED to CANCELLED--><g id="link_CONFIRMED_CANCELLED"><path d="M400.6,345.4095 C361.79,348.0395 307.39,358.7295 279.87,395.9395 C266.91,413.4495 267.45,427.0495 279.87,444.9395 C299.38,473.0695 331.2253,484.0713 361.2053,489.1813 " fill="none" id="CONFIRMED-to-CANCELLED" style="stroke:#4A5961;stroke-width:1.0;"/><polygon fill="#4A5961" points="367.12,490.1895,358.92,484.7341,362.1911,489.3493,357.5759,492.6204,367.12,490.1895" style="stroke:#4A5961;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="186.5767" x="295.0602" y="409.5332">customer before the start time</text><text fill="#7D878C" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="214.957" x="280.87" y="425.2627">advisor / admin before work starts:</text><text fill="#7D878C" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="108.7417" x="333.9777" y="440.9922">not in this version</text></g><!--link CONFIRMED to NO_SHOW--><g id="link_CONFIRMED_NO_SHOW"><path d="M400.74,347.7895 C301.81,353.4995 69.07,369.6195 45.87,395.9395 C6,441.1695 54.254,510.0294 83.544,544.6394 " fill="none" id="CONFIRMED-to-NO_SHOW" style="stroke:#B5BFBB;stroke-width:1.0;"/><polygon fill="#B5BFBB" points="87.42,549.2195,84.6593,539.7654,84.19,545.4028,78.5526,544.9334,87.42,549.2195" style="stroke:#B5BFBB;stroke-width:1.0;"/><text fill="#7D878C" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.395" x="46.87" y="417.5332">advisor / admin, after the start time</text><text fill="#7D878C" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="118.2251" x="95.455" y="433.2627">(not in this version)</text></g><!--link CONFIRMED to CONFIRMED--><g id="link_CONFIRMED_CONFIRMED"><path d="M489.13,331.8195 C507.89,330.8695 523.87,335.0795 523.87,344.4395 C523.87,353.7995 513.8823,358.3129 495.1223,357.3629 " fill="none" id="CONFIRMED-to-CONFIRMED" style="stroke:#B5BFBB;stroke-width:1.0;"/><polygon fill="#B5BFBB" points="489.13,357.0595,497.9162,361.5095,494.1236,357.3123,498.3208,353.5197,489.13,357.0595" style="stroke:#B5BFBB;stroke-width:1.0;"/><text fill="#7D878C" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="217.0962" x="529.87" y="341.5332">workshop controller / admin moves</tex