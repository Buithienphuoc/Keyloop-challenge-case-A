<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="875px" preserveAspectRatio="none" style="width:2353px;height:875px;background:#FFFFFF;" version="1.1" viewBox="0 0 2353 875" width="2353px" zoomAndPan="magnify"><title>Activity &#8212; the workshop day (UC30, UC32, UC33, UC40, UC41)</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="434.1299" x="957.9677" y="33.5625">Activity &#8212; the workshop day (UC30, UC32, UC33, UC40, UC41)</text></g><rect fill="none" height="15.7295" style="stroke:none;stroke-width:1;" width="2320.0652" x="15" y="49.5752"/><ellipse cx="312.0466" cy="80.3047" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#E6EEF7" height="51.459" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="237.7183" x="193.1875" y="110.3047"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="186.5449" x="203.1875" y="132.8984">Open the workshop day board</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="217.7183" x="203.1875" y="148.6279">(bays as rows, jobs placed by time)</text><rect fill="#E6EEF7" height="35.7295" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="122.4258" x="250.8337" y="181.7637"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="102.4258" x="260.8337" y="204.3574">Select a booking</text><polygon fill="#FDF4D2" points="238.0901,237.4932,386.0032,237.4932,398.0032,249.4932,386.0032,261.4932,238.0901,261.4932,226.0901,249.4932,238.0901,237.4932" style="stroke:#1F2A30;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="147.9131" x="238.0901" y="254.2222">Has the vehicle arrived?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="21.7471" x="204.343" y="246.3574">yes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="15.4756" x="398.0032" y="246.3574">no</text><rect fill="#E6EEF7" height="51.459" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="162.1875" x="21" y="281.4932"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="142.1875" x="31" y="304.0869">Hand the vehicle to the</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="122.3511" x="31" y="319.8164">assigned technician</text><polygon fill="#FDF4D2" points="521.5574,281.4932,693.2171,281.4932,705.2171,297.2227,693.2171,312.9521,521.5574,312.9521,509.5574,297.2227,521.5574,281.4932" style="stroke:#1F2A30;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="133.8403" x="521.5574" y="294.0869">Start time passed and</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="171.6597" x="521.5574" y="309.8164">the customer did not come?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="21.7471" x="487.8104" y="294.0869">yes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="204.3438" x="705.2171" y="294.0869">no: the booking must be dropped</text><rect fill="#E6EEF7" height="35.7295" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="109.1655" x="430.2629" y="332.9521"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="89.1655" x="440.2629" y="355.5459">Mark no-show</text><rect fill="#E6EEF7" height="35.7295" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="264.9053" x="597.4763" y="332.9521"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9053" x="607.4763" y="355.5459">Cancel the booking (before work starts)</text><polygon fill="#FDF4D2" points="607.3873,465.1406,619.3873,477.1406,607.3873,489.1406,595.3873,477.1406,607.3873,465.1406" style="stroke:#1F2A30;stroke-width:0.5;"/><polygon fill="#FDF4D2" points="312.0466,723.0586,324.0466,735.0586,312.0466,747.0586,300.0466,735.0586,312.0466,723.0586" style="stroke:#1F2A30;stroke-width:0.5;"/><line style="stroke:#B5BFBB;stroke-width:1.5;" x1="15" x2="15" y1="49.5752" y2="863.3823"/><rect fill="#E6EEF7" height="51.459" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="250.877" x="920.5609" y="367.9521"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.9048" x="930.5609" y="390.5459">Open "My jobs", read the service,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="230.877" x="930.5609" y="406.2754">the checklist and the customer's note</text><path d="M1101.7994,459.4111 L1101.7994,468.2759 L1081.7994,472.2759 L1101.7994,476.2759 L1101.7994,485.1406 A0,0 0 0 0 1101.7994,485.1406 L1391.5084,485.1406 A0,0 0 0 0 1391.5084,485.1406 L1391.5084,469.4111 L1381.5084,459.4111 L1101.7994,459.4111 A0,0 0 0 0 1101.7994,459.4111" fill="#FFFFFF" style="stroke:#B5BFBB;stroke-width:0.5;"/><path d="M1381.5084,459.4111 L1381.5084,469.4111 L1391.5084,469.4111 L1381.5084,459.4111" fill="#FFFFFF" style="stroke:#B5BFBB;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.709" x="1107.7994" y="477.0049">The advisor can also start it from the board.</text><rect fill="#E6EEF7" height="35.7295" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="71.6001" x="1010.1993" y="454.4111"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="51.6001" x="1020.1993" y="477.0049">Start job</text><rect fill="#E6EEF7" height="35.7295" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="94.4707" x="998.764" y="565.8701"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="74.4707" x="1008.764" y="588.4639">Do the work</text><rect fill="#E6EEF7" height="35.7295" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="77.8462" x="1007.0762" y="621.5996"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="57.8462" x="1017.0762" y="644.1934">Job done</text><line style="stroke:#B5BFBB;stroke-width:1.5;" x1="914.5609" x2="914.5609" y1="49.5752" y2="863.3823"/><rect fill="#E6EEF7" height="35.7295" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="207.3574" x="1403.5684" y="510.1406"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="93.7612" x="1413.5684" y="532.7344">CONFIRMED &#8594;</text><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="89.9399" x="1510.9859" y="532.7344">IN_PROGRESS</text><rect fill="#E6EEF7" height="35.7295" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="209.4775" x="1402.5084" y="677.3291"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="104.4443" x="1412.5084" y="699.9229">IN_PROGRESS &#8594;</text><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="81.377" x="1520.6089" y="699.9229">COMPLETED</text><rect fill="#E6EEF7" height="51.459" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="185.2612" x="1866.0691" y="403.6816"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="93.7612" x="1876.0691" y="426.2754">CONFIRMED &#8594;</text><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.8438" x="1973.4866" y="426.2754">NO_SHOW</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="162.1128" x="1876.0691" y="442.0049">(bay and technician freed)</text><rect fill="#E6EEF7" height="51.459" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="253.4858" x="2077.04" y="403.6816"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="93.7612" x="2087.04" y="426.2754">CONFIRMED &#8594;</text><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="78.73" x="2184.4575" y="426.2754">CANCELLED</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.4858" x="2087.04" y="442.0049">(slot freed, a linked request re-opens)</text><path d="M1969.8155,764.1938 L1969.8155,788.7881 L1949.8155,792.7881 L1969.8155,796.7881 L1969.8155,821.3823 A0,0 0 0 0 1969.8155,821.3823 L2316.5328,821.3823 A0,0 0 0 0 2316.5328,821.3823 L2316.5328,774.1938 L2306.5328,764.1938 L1969.8155,764.1938 A0,0 0 0 0 1969.8155,764.1938" fill="#FFFFFF" style="stroke:#B5BFBB;stroke-width:0.5;"/><path d="M2306.5328,764.1938 L2306.5328,774.1938 L2316.5328,774.1938 L2306.5328,764.1938" fill="#FFFFFF" style="stroke:#B5BFBB;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="325.7173" x="1975.8155" y="781.7876">Any other move (e.g. COMPLETED &#8594; IN_PROGRESS)</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="283.0737" x="1975.8155" y="797.5171">&#8594; 409; a technician acting on someone else's</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="178.8896" x="1975.8155" y="813.2466">job &#8594; 403. Nothing changes.</text><rect fill="#E6EEF7" height="51.459" rx="6" ry="6" style="stroke:#1D4E89;stroke-width:0.5;" width="327.8296" x="1621.9859" y="767.0586"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.918" x="1631.9859" y="789.6523">Write the audit row (appointment_events),</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.8296" x="1631.9859" y="805.3818">log appointment.status_changed, count the metric</text><ellipse cx="1785.9007" cy="852.3823" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="1785.9007" cy="852.3823" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#B5BFBB;stroke-width:1.5;" x1="1396.5084" x2="1396.5084" y1="49.5752" y2="863.3823"/><line style="stroke:#B5BFBB;stroke-width:1.5;" x1="2334.5259" x2="2334.5259" y1="49.5752" y2="863.3823"/><line style="stroke:#4A5961;stroke-width:1;" x1="312.0466" x2="312.0466" y1="90.3047" y2="110.3047"/><polygon fill="#4A5961" points="308.0466,100.3047,312.0466,110.3047,316.0466,100.3047,312.0466,104.3047" style="stroke:#4A5961;stroke-width:1;"/><line style="stroke:#4A5961;stroke-width:1;" x1="312.0466" x2="312.0466" y1="161.7637" y2="181.7637"/><polygon fill="#4A5961" points="308.0466,171.7637,312.0466,181.7637,316.0466,171.7637,312.0466,175.7637" style="stroke:#4A5961;stroke-width:1;"/><line style="stroke:#4A5961;stroke-width:1;" x1="509.5574" x2="484.8456" y1="297.2227" y2="297.2227"/><line style="stroke:#4A5961;stroke-width:1;" x1="484.8456" x2="484.8456" y1="297.2227" y2="332.9521"/><polygon fill="#4A5961" points="480.8456,322.9521,484.8456,332.9521,488.8456,322.9521,484.8456,326.9521" style="stroke:#4A5961;stroke-width:1;"/><line style="stroke:#4A5961;stroke-width:1;" x1="705.2171" x2="729.9289" y1="297.2227" y2="297.2227"/><line style="stroke:#4A5961;stroke-width:1;" x1="729.9289" x2="729.9289" y1="297.2227" y2="332.9521"/><polygon fill="#4A5961" points="725.9289,322.9521,729.9289,332.9521,733.9289,322.9521,729.9289,326.9521" style="stroke:#4A5961;stroke-width:1;"/><line style="stroke:#4A5961;stroke-width:1;" x1="226.0901" x2="102.0938" y1="249.4932" y2="249.4932"/><line style="stroke:#4A5961;stroke-width:1;" x1