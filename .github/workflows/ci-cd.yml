# Continuous integration and delivery.
#
#   every pull request and push: backend tests, web app lint/typecheck/build, both Docker images,
#                                and Selenium end-to-end tests against 3 API instances behind nginx
#   push to master:              the tested images are pushed to Azure Container Registry and rolled out to
#                                Azure Container Apps, then the live site is smoke-tested
#
# The deploy job runs only once deploy/azure/setup.sh has been run and its three outputs saved as
# repository variables (Settings → Secrets and variables → Actions → Variables):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   (+ optional AZURE_RESOURCE_GROUP, AZURE_ACR)
# GitHub signs in to Azure with OpenID Connect, so no password is stored anywhere.
#
# The site runs the API's prod profile on its own database (scheduler_prod). Its demo accounts get
# the passwords in the repository SECRET PROD_SEED_ACCOUNTS (hashes only, made with
# deploy/azure/prod-accounts.py); the web app's production build never shows any account.
name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Scala 3 / Play)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # Unit, integration (embedded PostgreSQL 17) and architecture tests.
      - run: sbt -batch test

  frontend:
    name: Web app (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    name: Docker images + end-to-end tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      id-token: write # OpenID Connect sign-in to Azure
    env:
      DEPLOY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.AZURE_CLIENT_ID != '' }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-service-scheduler' }}
    outputs:
      registry: ${{ steps.registry.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Built into the local Docker engine under the names docker-compose.yml uses, so the
      # end-to-end tests run against exactly the images that get deployed.
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: service-scheduler-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: service-scheduler-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Start 3 API instances, nginx and PostgreSQL
        run: docker compose --profile full up -d --no-build --wait postgres api web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # Selenium drives the runner's Google Chrome through the real web app.
      - name: End-to-end tests (Selenium)
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
        run: sbt -batch test
      - name: Keep screenshots and logs of a failed run
        if: failure()
        run: docker compose --profile full logs --no-color api web > e2e/target/compose.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: |
            e2e/target/screenshots/
            e2e/target/compose.log
          if-no-files-found: ignore

      - name: Sign in to Azure
        if: env.DEPLOY == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push the tested images to Azure Container Registry
        id: registry
        if: env.DEPLOY == 'true'
        run: |
          acr="${{ vars.AZURE_ACR }}"
          [ -n "$acr" ] || acr=$(az acr list -g "$RESOURCE_GROUP" --query '[0].name' -o tsv)
          az acr login --name "$acr"
          server=$(az acr show -n "$acr" --query loginServer -o tsv)
          for app in api web; do
            docker tag "service-scheduler-$app:latest" "$server/service-scheduler-$app:${{ github.sha }}"
            docker push "$server/service-scheduler-$app:${{ github.sha }}"
          done
          echo "server=$server" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.AZURE_CLIENT_ID != ''
    environment:
      name: production
      url: ${{ steps.rollout.outputs.url }}
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-service-scheduler' }}
      REGISTRY: ${{ needs.images.outputs.registry }}
    steps:
      - name: Check the production account passwords are set
        env:
          SEED_ACCOUNTS: ${{ secrets.PROD_SEED_ACCOUNTS }}
        run: |
          [ -n "$SEED_ACCOUNTS" ] && exit 0
          echo "::error title=PROD_SEED_ACCOUNTS missing::Add the repository secret PROD_SEED_ACCOUNTS (made by deploy/azure/prod-accounts.py) so the production accounts get their own passwords."
          exit 1
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Production database and account passwords
        env:
          SEED_ACCOUNTS: ${{ secrets.PROD_SEED_ACCOUNTS }}
        run: |
          # Production keeps its own database next to the original one on the same server, so it
          # starts from a clean seed with the production passwords. Both steps are no-ops once done.
          pg=$(az postgres flexible-server list -g "$RESOURCE_GROUP" --query '[0].name' -o tsv)
          az postgres flexible-server db show -g "$RESOURCE_GROUP" -s "$pg" -n scheduler_prod -o none 2>/dev/null ||
            az postgres flexible-server db create -g "$RESOURCE_GROUP" -s "$pg" -n scheduler_prod -o none
          url=$(az containerapp secret show -g "$RESOURCE_GROUP" -n scheduler-api --secret-name database-url --query value -o tsv)
          echo "::add-mask::$url"
          prod_url=$(sed -E 's#/scheduler(\?|$)#/scheduler_prod\1#' <<< "$url")
          # Secrets change without a new revision; the image update below starts one that reads them.
          az containerapp secret set -g "$RESOURCE_GROUP" -n scheduler-api \
            --secrets "database-url=$prod_url" "seed-accounts=$SEED_ACCOUNTS" -o none
      - name: Roll out the new images
        id: rollout
        run: |
          exec 2> >(tee "$RUNNER_TEMP/rollout.err" >&2) # kept for the failure report below
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          # The apps are created with a placeholder image on port 80. Point ingress at our ports
          # before the new image goes in: ingress is app-wide (no new revision), and a revision
          # whose port does not answer never becomes ready, which fails the update.
          for pair in scheduler-api:8081 scheduler-web:8080; do
            app="${pair%%:*}"; port="${pair#*:}"
            [ "$(az containerapp show -g "$RESOURCE_GROUP" -n "$app" --query properties.configuration.ingress.targetPort -o tsv)" = "$port" ] ||
              az containerapp ingress update -g "$RESOURCE_GROUP" -n "$app" --target-port "$port" -o none
          done
          # API first: the database migrates on its start-up, before the new web app needs it.
          az containerapp update -g "$RESOURCE_GROUP" -n scheduler-api \
            --image "$REGISTRY/service-scheduler-api:${{ github.sha }}" \
            --set-env-vars APP_PROFILE=prod SEED_ACCOUNT_PASSWORDS=secretref:seed-accounts \
            --only-show-errors -o none
          az containerapp update -g "$RESOURCE_GROUP" -n scheduler-web \
            --image "$REGISTRY/service-scheduler-web:${{ github.sha }}" --only-show-errors -o none
          fqdn=$(az containerapp show -g "$RESOURCE_GROUP" -n scheduler-web --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: |
          url="${{ steps.rollout.outputs.url }}"
          for i in $(seq 1 40); do
            if curl -fsS "$url/health" && curl -fsS -o /dev/null "$url/"; then
              echo; echo "Live at $url"; break
            fi
            [ "$i" = 40 ] && { echo "The site did not become healthy in time" >&2; exit 1; }
            sleep 10
          done
          # The prod profile is on: the public demo password signs nobody in, and no web app file
          # carries it.
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"email":"customer@demo.vn","password":"Demo@2026"}' "$url/api/auth/login")
          [ "$status" = 401 ] || { echo "::error::The demo password still signs in on production (HTTP $status)"; exit 1; }
          for asset in $(curl -fsS "$url/" | grep -oE '/assets/[^"]+\.js'); do
            ! curl -fsS "$url$asset" | grep -q 'Demo@2026' || { echo "::error::$asset contains the demo password"; exit 1; }
          done
          echo "Production profile checks passed"
      - name: Show why a rollout failed
        if: failure()
        run: |
          # Printed as annotations, so the cause shows on the run's summary page.
          annotate() { local t="${2//'%'/'%25'}"; t="${t//$'\r'/}"; echo "::error title=$1::${t//$'\n'/'%0A'}"; }
          [ -s "$RUNNER_TEMP/rollout.err" ] && annotate "rollout" "$(tail -c 8000 "$RUNNER_TEMP/rollout.err")"
          for app in scheduler-api scheduler-web; do
            report=$( {
              az containerapp revision list -g "$RESOURCE_GROUP" -n "$app" \
                --query "[].{revision:name, active:properties.active, health:properties.healthState, state:properties.runningState, image:properties.template.containers[0].image}" -o table
              az containerapp logs show -g "$RESOURCE_GROUP" -n "$app" --type system --tail 20 --format text
              az containerapp logs show -g "$RESOURCE_GROUP" -n "$app" --type console --tail 40 --format text
            } 2>&1 | tail -c 20000 || true)
            annotate "$app" "$report"
          done
