# Scrapes /metrics on every API replica. Docker's DNS answers "api" with one address per
# replica, so scaling the service adds scrape targets with no config change.
global:
  scrape_interval: 10s
scrape_configs:
  - job_name: service-scheduler
    metrics_path: /metrics
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8081
