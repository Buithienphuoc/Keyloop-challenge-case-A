# Service Scheduler configuration. Every value can be overridden by the environment variable
# named next to it, so the same build runs on a laptop, in docker-compose and in production.

scheduler {
  # PostgreSQL URL (postgres://user:pass@host:port/db or jdbc:postgresql://...).
  # When empty, an embedded PostgreSQL is started so `sbt run` works with no setup.
  database-url = ""
  database-url = ${?DATABASE_URL}

  embedded-pg-port = 54330
  embedded-pg-port = ${?EMBEDDED_PG_PORT}

  # Where the embedded PostgreSQL keeps its data (relative to the backend folder).
  data-dir = "../.data"
  data-dir = ${?DATA_DIR}

  # Queries slower than this are logged as warnings.
  slow-query-ms = 200
  slow-query-ms = ${?SLOW_QUERY_MS}

  session-ttl-hours = 12
  session-ttl-hours = ${?SESSION_TTL_HOURS}

  # Loads the demo dealerships, staff and customer on an empty database.
  seed-demo-data = true
  seed-demo-data = ${?SEED_DEMO_DATA}

  # Comma-separated list of browser origins allowed to call the API.
  cors-origins = "http://localhost:5173"
  cors-origins = ${?CORS_ORIGIN}

  db-pool-size = 20
  db-pool-size = ${?DB_POOL_SIZE}
}

play {
  application.loader = scheduler.AppLoader

  # Not used for sessions (the API uses bearer tokens) but Play requires one in production.
  http.secret.key = "dev-only-secret-change-me-in-production-0123456789"
  http.secret.key = ${?APPLICATION_SECRET}

  http.parser.maxMemoryBuffer = 64k

  server.http.port = 8081
  server.http.port = ${?PORT}

  # The API never renders HTML and is consumed cross-origin, so CSRF / host filters do not apply.
  filters.hosts.allowed = ["."]
}

# Accept queue for new TCP connections. Pekko HTTP's default (100) drops connections when
# hundreds of clients connect at the same instant (see the burst load test).
pekko.http.server.backlog = 1024
